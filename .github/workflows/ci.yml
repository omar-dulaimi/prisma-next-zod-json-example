name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The library is the thing most likely to break this app, so check weekly even when nothing here
  # changed.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: events
        ports: ['55435:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:55435/events

    steps:
      # Checked out as siblings under the workspace, because package.json links the library at
      # `../prisma-next-zod-json` and actions/checkout cannot write outside the workspace.
      - name: Check out this app
        uses: actions/checkout@v5
        with:
          path: prisma-next-zod-json-example

      # Needed only until the library is published to npm. LIB_REPO_TOKEN must be a PAT with read
      # access to the library repo — the default GITHUB_TOKEN cannot read a different private repo.
      - name: Check out the library it links to
        uses: actions/checkout@v5
        with:
          repository: omar-dulaimi/prisma-next-zod-json
          path: prisma-next-zod-json
          token: ${{ secrets.LIB_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Build the library
        working-directory: prisma-next-zod-json
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install
        working-directory: prisma-next-zod-json-example
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: prisma-next-zod-json-example
        run: pnpm typecheck

      - name: Emit the contract
        working-directory: prisma-next-zod-json-example
        run: pnpm emit

      - name: The emitted types must be real, not `unknown`
        working-directory: prisma-next-zod-json-example
        # The whole point of a typed JSON column. If this regressed the app would still run, and every
        # consumer of the generated types would quietly lose them.
        run: |
          set -euo pipefail
          grep -q "kind: 'payment.succeeded'" src/prisma/contract.d.ts
          grep -q "backoff: 'fixed' | 'exponential'" src/prisma/contract.d.ts
          echo "contract.d.ts carries the real shapes"

      - name: Create the database
        working-directory: prisma-next-zod-json-example
        run: pnpm db:init

      - name: Integration tests
        working-directory: prisma-next-zod-json-example
        run: pnpm test

      - name: Guided tour
        working-directory: prisma-next-zod-json-example
        run: pnpm tour
