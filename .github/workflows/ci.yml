name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The library is the thing most likely to break this app, so check weekly even when nothing here
  # changed.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: events
        ports: ['55435:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:55435/events

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Emit the contract
        run: pnpm emit

      - name: The emitted types must be real, not `unknown`
        # The whole point of a typed JSON column. If this regressed the app would still run, and every
        # consumer of the generated types would quietly lose them.
        run: |
          set -euo pipefail
          grep -q "kind: 'payment.succeeded'" src/prisma/contract.d.ts
          grep -q "backoff: 'fixed' | 'exponential'" src/prisma/contract.d.ts
          echo "contract.d.ts carries the real shapes"

      - name: Create the database
        run: pnpm db:init

      - name: Integration tests
        run: pnpm test

      - name: Guided tour
        run: pnpm tour
